world:
  height: 10  # the height of the world
  width: 10   # the width of the world
  step_time: 0.1  # 10Hz calculate each step
  sample_time: 0.1  # 10 Hz for render and data extraction 
  offset: [0, 0] # the offset of the world on x and y 
  collision_mode: 'unobstructed_obstacles'  # 'stop', 'unobstructed', 'reactive'

robot:
  - kinematics: {name: 'omni'}  # omni, diff, acker
    shape: {name: 'circle', radius: 0.3}  # radius
    # shape: {name: 'rectangle', length: 0.3, width: 1.0} 
    state: [1, 1, 0]  
    goal: [9, 9, 0] 
    # acce: [3, .inf]   # acce of [linear, angular]  or [v_x, v_y] or [linear, steer]
    behavior: {name: 'rvo'} # move toward to the goal directly 
    # color: 'g'
    state_dim: 3
    plot:
      show_trajectory: True

human:
  - kinematics: {name: 'omni'}  # omni, diff, acker
    shape: {name: 'circle', radius: 0.3}  # radius
    # shape: {name: 'rectangle', length: 0.3, width: 1.0} 
    state: [2, 1, 0]  
    goal:
    - [[2, 1, 0], [4, 1, 0], [4, 3, 0], [2, 3, 0], [2, 1, 0]]
    # acce: [3, .inf]   # acce of [linear, angular]  or [v_x, v_y] or [linear, steer]
    behavior: {name: 'rvo'} # move toward to the goal directly 
    state_dim: 3
    plot:
      show_trajectory: True


